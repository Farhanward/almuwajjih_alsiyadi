[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "almuwajjih-alsiyadi"
version = "1.0.0"
authors = [{ name = "Farhan Almutairi", email = "far7an.o88@gmail.com" }]
description = "Sovereign local/cloud AI router."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

[project.scripts]
almuwajjih-alsiyadi = "almuwajjih_alsiyadi.cli:main"

[tool.setuptools]
packages = ["almuwajjih_alsiyadi"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
